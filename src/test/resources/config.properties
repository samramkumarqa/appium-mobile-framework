# Defaults only. Override any key with -Dkey=value or an environment variable
# (dots become underscores, upper case): e.g. PLATFORM=ios, APPIUM_URL=http://127.0.0.1:4723

# android | ios
platform=android

# Appium 2+ server root (no /wd/hub)
appium.url=http://127.0.0.1:4723

timeout.seconds=20
new.command.timeout.seconds=120

# ---- Android ----
# Path to the My Demo App APK (relative paths are resolved from the project folder), or an https URL
android.app=apps/MyDemoAppRN.apk
android.device.name=Android Emulator
# Optional: target one device when several are connected (see `adb devices`)
android.udid=
# Optional: name of an emulator (AVD) for Appium to boot if none is running
android.avd=

# ---- iOS (simulator) ----
# Path to the unzipped MyDemoAppRN.app simulator build
ios.app=apps/MyDemoAppRN.app
ios.device.name=iPhone 15
# Optional: e.g. 17.5. Leave empty to use the newest installed runtime.
ios.platform.version=
