name: Android Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        description: Suite to run
        type: choice
        options: [regression, smoke]
        default: regression

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLATFORM: android
      APPIUM_URL: http://127.0.0.1:4723
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Hardware acceleration makes the emulator usable on Linux runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download My Demo App (Android)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo saucelabs/my-demo-app-rn --pattern '*Android*.apk' --output apps/MyDemoAppRN.apk
          ls -la apps/

      - name: Install and start Appium
        run: |
          npm install -g appium
          appium driver install uiautomator2
          nohup appium --log-timestamp > appium.log 2>&1 &

      - name: Compile tests
        run: mvn -B -q test-compile

      - name: Run tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: mvn -B test -Dsuite=${{ inputs.suite || 'regression' }}

      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: android-reports
          path: |
            target/extent-report/
            target/surefire-reports/
            appium.log
          retention-days: 14
